<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Operations Management 1 — Student Study & Quiz Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#312e81">
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="header-container">
            <h1>🛒 Retail Operations Management 1 — Study Hub</h1>
            <nav id="nav-menu">
                <button onclick="switchChapter('ch6_1')" id="nav-ch6_1" class="active">Ch 6.1: Entrepreneurship</button>
                <button onclick="switchChapter('ch6_2')" id="nav-ch6_2">Ch 6.2: Business Plan</button>
                <button onclick="switchChapter('ch7')" id="nav-ch7">Ch 7: Control</button>
                <button onclick="switchChapter('ch8')" id="nav-ch8">Ch 8: Leadership Styles</button>
                <button onclick="switchChapter('ch9')" id="nav-ch9">Ch 9: Leadership Theories</button>
                <button onclick="switchChapter('ch10')" id="nav-ch10">Ch 10: Motivation</button>
                <button onclick="switchChapter('ch11')" id="nav-ch11">Ch 11: Stakeholders</button>
                <button onclick="switchChapter('ch12')" id="nav-ch12">Ch 12: Assets & Risks</button>
                <button onclick="switchChapter('ch13')" id="nav-ch13">Ch 13: Health & Safety</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="chapter-view">
        <!-- Dynamically rendered via app.js -->
    </main>

    <!-- Footer -->
    <footer>
        <p>Retail Operations Management 1 • Built for Student Success • Works 100% Offline (PWA)</p>
    </footer>

    <!-- App Scripts -->
    <script src="app.js"></script>
    <script>
        // Register Service Worker for Offline PWA Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered successfully!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
