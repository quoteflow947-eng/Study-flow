<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Flow - Retail Operations Management 1</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <header class="app-header">
        <h1>Study Flow</h1>
        <p>Retail Operations Management 1</p>
    </header>

    <main class="container">
        <!-- Subject Selection / Home View -->
        <section id="home-view" class="view active">
            <h2>Modules</h2>
            <div class="module-card" onclick="openModule('retail-ops')">
                <h3>Retail Operations Management 1</h3>
                <p>Chapters 6 (Part 1 & 2) to 13</p>
            </div>
            <div class="module-card disabled">
                <h3>Retailing 1</h3>
                <p>Coming Soon</p>
            </div>
            <div class="module-card disabled">
                <h3>Communication</h3>
                <p>Coming Soon</p>
            </div>
            <div class="module-card disabled">
                <h3>Business Computer Applications</h3>
                <p>Coming Soon</p>
            </div>
            <div class="module-card disabled">
                <h3>Retail Financial Management 1</h3>
                <p>Coming Soon</p>
            </div>
        </section>

        <!-- Retail Ops Chapters View -->
        <section id="retail-ops-view" class="view">
            <button class="back-btn" onclick="goHome()">← Back to Modules</button>
            <h2>Retail Operations Management 1</h2>
            <div class="chapter-list">
                <button class="chapter-btn" onclick="loadChapter(6, 1)">Chapter 6 (Part 1): Entrepreneurship</button>
                <button class="chapter-btn" onclick="loadChapter(6, 2)">Chapter 6 (Part 2): The Business Plan</button>
                <button class="chapter-btn" onclick="loadChapter(7, 0)">Chapter 7: Control</button>
                <button class="chapter-btn" onclick="loadChapter(8, 0)">Chapter 8: Leadership (Part 1)</button>
                <button class="chapter-btn" onclick="loadChapter(9, 0)">Chapter 9: Leadership (Part 2)</button>
                <button class="chapter-btn" onclick="loadChapter(10, 0)">Chapter 10: Leading (Motivation)</button>
                <button class="chapter-btn" onclick="loadChapter(11, 0)">Chapter 11: Stakeholders</button>
                <button class="chapter-btn" onclick="loadChapter(12, 0)">Chapter 12: Assets and Risks in Retail</button>
                <button class="chapter-btn" onclick="loadChapter(13, 0)">Chapter 13: Health, Safety & Wellness</button>
            </div>
        </section>

        <!-- Content View -->
        <section id="content-view" class="view">
            <button class="back-btn" onclick="backToChapters()">← Back to Chapters</button>
            <div id="chapter-content" class="chapter-box">
                <!-- Dynamically injected chapter text -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log("Service Worker Registered Successfully"));
        }
    </script>
</body>
</html>
